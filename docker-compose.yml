services:
  backend:
    container_name: product-composer-backend
    image: product-composer-backend:latest
    build:
      context: .
      target: backend
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: "http://47.121.181.240:8002,http://localhost:8002,http://127.0.0.1:8002"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    container_name: product-composer
    image: product-composer-web:latest
    build:
      context: .
      target: web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8002:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
